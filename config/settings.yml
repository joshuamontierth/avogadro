# Only overrides live here; everything else comes from SearXNG's defaults.
# Restart after editing: docker compose restart
use_default_settings: true

server:
  # base_url and secret_key come from SEARXNG_BASE_URL and SEARXNG_SECRET in .env
  limiter: false
  public_instance: false

search:
  formats: [html, json]
  # Favicons for the page's /favicon/<host> route (cached by SearXNG).
  favicon_resolver: duckduckgo

# General web engines that answer from this network (tested 2026-10-15). Google CSE,
# Wikipedia and Wikidata are on by default. Brave and DuckDuckGo return 429 / CAPTCHA.
engines:
  - name: bing
    disabled: false
  - name: duckduckgo web
    disabled: false
  - name: yahoo
    disabled: false
  - name: yep
    disabled: false
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  # Other categories: these fail on every request from here (crash / access denied).
  - name: brave.images
    disabled: true
  - name: brave.news
    disabled: true
  - name: brave.videos
    disabled: true
  - name: google news
    disabled: true
  - name: google videos
    disabled: true

# Signs result images for SearXNG's /image proxy and serves /favicon/<host> for the Avogadro page.
plugins:
  searx.plugins.avogadro.SXNGPlugin:
    active: true
